version: '3.8'

services:
  aframp-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: aframp-dev
    ports:
      # The frontend MUST be reachable on 3001, not 3000.
      # The backend binds port 3000 and its CORS_ALLOWED_ORIGINS defaults to
      # http://localhost:3001, so running the frontend on 3000 causes silent
      # CORS failures (every API request fails). Keep the host port at 3001
      # and set NEXT_PUBLIC_API_URL to point at the backend on 3000.
      - '3001:3001'
    env_file:
      - .env.local
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      # Mount source code for hot-reload
      - .:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
    command: npm run dev
    networks:
      - aframp-network

networks:
  aframp-network:
    driver: bridge
