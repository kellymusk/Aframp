version: '3.8'

services:
  aframp-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        # Fixed into the build; see the Dockerfile. Set it in .env (read by
        # compose for substitution) or the shell environment.
        NEXT_API_URL: ${NEXT_API_URL:-}
    container_name: aframp-prod
    ports:
      - '3000:3000'
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
    restart: always
    healthcheck:
      test: ['CMD', 'node', 'healthcheck.js']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - aframp-network
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

networks:
  aframp-network:
    driver: bridge
