name: 🚀 Feature Request
description: Propose a new feature or improvement
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape AFRAMP!
        Before opening a new request, please search existing issues to avoid duplicates.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I searched existing issues and this feature has not been requested yet.
          required: true
        - label: This feature aligns with AFRAMP's goal of enabling African financial access.
          required: true

  - type: dropdown
    id: feature_type
    attributes:
      label: Feature Type
      options:
        - New feature
        - Enhancement to existing feature
        - Developer experience / tooling
        - Performance improvement
        - Accessibility improvement
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: feature_area
    attributes:
      label: Feature Area
      options:
        - Onramp (fiat → crypto)
        - Offramp (crypto → fiat)
        - Bill Payments
        - Stellar / Wallet
        - Mobile Money (M-Pesa / MTN MoMo)
        - KYC / Verification
        - Dashboard / Portfolio
        - Swap
        - Notifications
        - Authentication / Onboarding
        - Settings
        - Admin
        - Observability / Monitoring
        - CI/CD / Infrastructure
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: |
        Describe the problem or user need this feature addresses.
        Start with "As a [user type], I want to… so that…" if helpful.
      placeholder: |
        As a Kenyan user, I want to schedule recurring bill payments for my
        electricity so that I don't miss payment deadlines while travelling.
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: |
        Describe how you envision the feature working. Include any UI mockups,
        API designs, or technical approaches you have in mind.
      placeholder: |
        Add a "Schedule Payment" toggle on the bill payment form that lets users
        pick a recurrence (daily / weekly / monthly) and an end date. Persist
        the schedule in Upstash Redis and process it via a Vercel Cron Job.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: |
        What other approaches or workarounds did you consider, and why do you
        prefer the proposed solution over them?
      placeholder: |
        I considered using a third-party scheduled-payments service, but that
        introduces an external dependency and additional cost. A Vercel Cron Job
        keeps everything in-platform and is already supported by our stack.

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: How do we know this feature is done? List observable outcomes.
      placeholder: |
        - [ ] User can toggle "Repeat" on the bill payment form
        - [ ] User can select frequency: daily / weekly / monthly
        - [ ] Scheduled payment appears in "Upcoming" list on the bills page
        - [ ] Payment executes automatically within ±5 minutes of the scheduled time
        - [ ] User receives a notification on success or failure

  - type: dropdown
    id: priority
    attributes:
      label: Perceived Priority
      description: How important is this to you?
      options:
        - 🔴 Critical — blocking my use of the app
        - 🟠 High — significant improvement
        - 🟡 Medium — nice to have
        - 🟢 Low — minor improvement
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: |
        Links to related issues, design files, research, competitor implementations,
        or any other context that helps make the case for this feature.
