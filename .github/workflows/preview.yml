name: Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  deploy-preview:
    name: Deploy Preview to Unique URL
    runs-on: ubuntu-latest
    # `secrets` can't be used in a job-level `if` (GitHub rejects the whole
    # workflow), so the token is exposed as env and each step checks it.
    if: github.event.action != 'closed'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if Vercel secrets not configured
        if: env.VERCEL_TOKEN == ''
        run: echo "⏭️ Vercel secrets not configured — skipping preview deployment"

      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        id: vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          scope: ${{ secrets.VERCEL_ORG_ID }}

      - name: Comment preview link on PR
        if: env.VERCEL_TOKEN != '' && steps.vercel-deploy.outputs.preview-url != ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Preview Deployment Ready!\n\n**Preview URL:** ${{ steps.vercel-deploy.outputs.preview-url }}\n\n✅ Build successful\n📱 Test on mobile and desktop\n🔍 Verify all functionality\n\n*This preview will be automatically deleted when the PR is closed.*`
            });

  cleanup-preview:
    name: Auto-delete Preview
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Delete Vercel Preview
        if: env.VERCEL_TOKEN != ''
        run: |
          curl -X DELETE "https://api.vercel.com/v13/deployments/${{ github.event.pull_request.head.sha }}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" || true

      - name: Comment cleanup
        if: env.VERCEL_TOKEN != ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🧹 Preview deployment deleted.'
            });

