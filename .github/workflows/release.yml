name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Run Release Please
        uses: google-github-actions/release-please-action@v4
        with:
          # Prefer a fine-grained PAT (RELEASE_PLEASE_TOKEN) with Contents and
          # Pull requests read/write access; fall back to GITHUB_TOKEN when
          # "Allow GitHub Actions to create and approve pull requests" is enabled
          # under Settings → Actions → General → Workflow permissions.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          release-type: node
