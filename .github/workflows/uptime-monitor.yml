name: Uptime Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    name: Check Production Uptime
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      # Override with the PRODUCTION_URL repository variable (Settings ->
      # Secrets and variables -> Actions -> Variables) to monitor a different
      # origin, e.g. the Vercel production URL. No trailing slash.
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://app.aframp.com' }}
    steps:
      - name: Restore prior failure count
        uses: actions/cache/restore@v4
        with:
          path: .uptime-monitor-state.json
          key: uptime-monitor-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: uptime-monitor-state-

      - name: Check homepage
        id: homepage
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${PRODUCTION_URL%/}/" || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "status=down" >> "$GITHUB_OUTPUT"
            echo "⚠️ Homepage returned HTTP $STATUS"
          else
            echo "status=up" >> "$GITHUB_OUTPUT"
            echo "✅ Homepage up"
          fi

      - name: Check login page
        id: login
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${PRODUCTION_URL%/}/login" || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "status=down" >> "$GITHUB_OUTPUT"
            echo "⚠️ Login page returned HTTP $STATUS"
          else
            echo "status=up" >> "$GITHUB_OUTPUT"
            echo "✅ Login page up"
          fi

      - name: Check wallet dashboard
        id: wallet
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${PRODUCTION_URL%/}/wallet" || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "status=down" >> "$GITHUB_OUTPUT"
            echo "⚠️ Wallet page returned HTTP $STATUS"
          else
            echo "status=up" >> "$GITHUB_OUTPUT"
            echo "✅ Wallet page up"
          fi

      - name: Track consecutive failures
        id: failures
        shell: bash
        run: |
          STATE_FILE=.uptime-monitor-state.json
          if [ -f "$STATE_FILE" ]; then
            FAILURES=$(jq -r '.failures // 0' "$STATE_FILE")
          else
            FAILURES=0
          fi

          DOWN=false
          if [ "${{ steps.homepage.outputs.status }}" = "down" ] || \
             [ "${{ steps.login.outputs.status }}" = "down" ] || \
             [ "${{ steps.wallet.outputs.status }}" = "down" ]; then
            DOWN=true
          fi

          if [ "$DOWN" = "true" ]; then
            FAILURES=$((FAILURES + 1))
          else
            FAILURES=0
          fi

          printf '{"failures": %s}\n' "$FAILURES" > "$STATE_FILE"
          echo "count=$FAILURES" >> "$GITHUB_OUTPUT"
          echo "down=$DOWN" >> "$GITHUB_OUTPUT"

      # Cache entries are immutable, so save under a unique key per run; the
      # restore step above picks up the most recent one via its prefix.
      - name: Save failure count
        uses: actions/cache/save@v4
        with:
          path: .uptime-monitor-state.json
          key: uptime-monitor-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Create outage issue after 3 failures
        if: ${{ steps.failures.outputs.count >= 3 }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 AFRAMP production uptime alert';
            const body = [
              'The production site has failed the uptime checks for three consecutive runs.',
              '',
              'Affected endpoints:',
              `- Homepage: ${{ steps.homepage.outputs.status }}`,
              `- Login: ${{ steps.login.outputs.status }}`,
              `- Wallet: ${{ steps.wallet.outputs.status }}`,
              '',
              'This issue will be auto-closed when the site responds again.'
            ].join('\n');

            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = issues.find((issue) => issue.title === title);

            if (!existing) {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ['bug', 'uptime'],
              });
            }

      - name: Close outage issue when restored
        if: ${{ steps.failures.outputs.count == '0' }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 AFRAMP production uptime alert';
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const openIssue = issues.find((issue) => issue.title === title);

            if (openIssue) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: openIssue.number,
                state: 'closed',
              });
            }

      - name: Alert on downtime
        if: ${{ steps.failures.outputs.down == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const statuses = {
              Homepage: '${{ steps.homepage.outputs.status }}',
              Login: '${{ steps.login.outputs.status }}',
              Wallet: '${{ steps.wallet.outputs.status }}',
            };
            const down = Object.entries(statuses)
              .filter(([, v]) => v === 'down')
              .map(([k]) => `  • ${k}`)
              .join('\n');
            console.log(
              `🚨 ALERT: AFRAMP production endpoints are DOWN\n\nTime: ${new Date().toISOString()}\n\nAffected:\n${down}\n\nCheck: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`
            );
            core.setFailed(`AFRAMP production endpoints are DOWN:\n${down}`);
