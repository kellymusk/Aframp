name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build test image
        run: docker-compose -f docker-compose.test.yml build
        env:
          BUILDKIT_INLINE_CACHE: 1

      - name: Run Lint
        run: docker-compose -f docker-compose.test.yml run --rm aframp-lint

      - name: Run TypeScript Check
        run: docker-compose -f docker-compose.test.yml run --rm aframp-typecheck

      - name: Run Prettier Check
        run: docker-compose -f docker-compose.test.yml run --rm aframp-test npm run format:check

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Snyk Security Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run OWASP scan
        run: bash scripts/owasp-scan.sh
        continue-on-error: true

      - name: Run wallet deps audit
        run: bash scripts/audit-wallet-deps.sh
        continue-on-error: true

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build test image
        run: docker-compose -f docker-compose.test.yml build
        env:
          BUILDKIT_INLINE_CACHE: 1

      - name: Run tests with coverage
        run: docker-compose -f docker-compose.test.yml run --rm aframp-test

      - name: Check route bundle budget
        run: |
          npm run build:analyze
          node scripts/check-bundle-budget.mjs

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          retention-days: 1

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json', 'utf8'));
            const total = coverage.total;

            const badge = (pct) => {
              if (pct >= 80) return '🟢';
              if (pct >= 70) return '🟡';
              return '🔴';
            };

            const row = (label, metric) => `| ${label} | ${metric.pct}% | ${badge(metric.pct)} |`;

            const comment = [
              '## 📊 Coverage Report',
              '',
              '| Metric | Coverage | Status |',
              '|--------|----------|--------|',
              row('Lines', total.lines),
              row('Statements', total.statements),
              row('Functions', total.functions),
              row('Branches', total.branches),
              '',
              '🟢 = Excellent (≥80%) | 🟡 = Good (≥70%) | 🔴 = Needs Improvement (<70%)',
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  pr-description:
    name: PR Description Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require a filled-in Summary
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || ''
            const match = body.match(/## Summary\s*([\s\S]*?)(?=\n##|\n---|$)/)
            const summary = (match ? match[1] : '')
              .replace(/<!--[\s\S]*?-->/g, '')
              .replace(/^Closes #.*$/gim, '')
              .trim()
            if (summary.length < 15) {
              core.setFailed(
                "This PR's Summary section is empty or unedited from the template. " +
                'Explain what the PR does and why before requesting review.'
              )
            }

  diff-coverage:
    name: Diff Coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build test image
        run: docker-compose -f docker-compose.test.yml build
        env:
          BUILDKIT_INLINE_CACHE: 1

      - name: Run tests with coverage
        run: docker-compose -f docker-compose.test.yml run --rm aframp-test

      - name: Require 80% coverage on changed files
        run: |
          docker-compose -f docker-compose.test.yml run --rm aframp-test \
            node scripts/check-diff-coverage.js \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [code-quality, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_STELLAR_NETWORK: TESTNET

  lighthouse:
    name: Lighthouse CI (90+ all categories)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_STELLAR_NETWORK: TESTNET

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.0

      - name: Start server and run Lighthouse CI
        run: |
          npm start &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001 > /dev/null 2>&1 && echo "Server ready after ${i}s" && break
            sleep 2
          done
          lhci autorun
          kill $SERVER_PID 2>/dev/null || true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results-${{ github.run_number }}
          path: .lighthouseci/
          retention-days: 30
