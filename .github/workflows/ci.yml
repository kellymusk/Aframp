name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, dev-frontend]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build test image
        run: docker compose -f docker-compose.test.yml build
        env:
          BUILDKIT_INLINE_CACHE: 1

      - name: Run Lint
        run: docker compose -f docker-compose.test.yml run --rm aframp-lint

      - name: Run TypeScript Check
        run: docker compose -f docker-compose.test.yml run --rm aframp-typecheck

      - name: Run Prettier Check
        run: docker compose -f docker-compose.test.yml run --rm aframp-test npm run format:check

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Snyk Security Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run OWASP scan
        run: bash scripts/owasp-scan.sh
        continue-on-error: true

      - name: Run wallet deps audit
        run: bash scripts/audit-wallet-deps.sh
        continue-on-error: true

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build test image
        run: docker compose -f docker-compose.test.yml build
        env:
          BUILDKIT_INLINE_CACHE: 1

      - name: Run tests with coverage
        run: docker compose -f docker-compose.test.yml run --rm aframp-test

      # The tests above ran inside the Docker image; the bundle build runs on
      # the runner, so it needs its own Node and dependencies.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # docker-compose.test.yml mounts node_modules and .next as anonymous
      # volumes inside the repo bind mount, which leaves root-owned empty
      # directories in the checkout; clear them so npm can write.
      - name: Install dependencies
        run: |
          sudo rm -rf node_modules .next
          npm ci

      - name: Check route bundle budget
        run: |
          npm run build:analyze
          node scripts/check-bundle-budget.mjs

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          retention-days: 1

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        # Fork PRs get a read-only token; the report is informational, so never fail on it.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json', 'utf8'));
            const total = coverage.total;

            const badge = (pct) => {
              if (pct >= 80) return '🟢';
              if (pct >= 70) return '🟡';
              return '🔴';
            };

            const row = (label, metric) => `| ${label} | ${metric.pct}% | ${badge(metric.pct)} |`;

            const comment = [
              '## 📊 Coverage Report',
              '',
              '| Metric | Coverage | Status |',
              '|--------|----------|--------|',
              row('Lines', total.lines),
              row('Statements', total.statements),
              row('Functions', total.functions),
              row('Branches', total.branches),
              '',
              '🟢 = Excellent (≥80%) | 🟡 = Good (≥70%) | 🔴 = Needs Improvement (<70%)',
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  image-budget:
    name: Image Size Budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check image size budgets
        run: node scripts/check-image-budget.mjs

  pr-description:
    name: PR Description Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require a filled-in Summary
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || ''
            const match = body.match(/## Summary\s*([\s\S]*?)(?=\n##|\n---|$)/)
            const summary = (match ? match[1] : '')
              .replace(/<!--[\s\S]*?-->/g, '')
              .replace(/^Closes #.*$/gim, '')
              .trim()
            if (summary.length < 15) {
              core.setFailed(
                "This PR's Summary section is empty or unedited from the template. " +
                'Explain what the PR does and why before requesting review.'
              )
            }

  diff-coverage:
    name: Diff Coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build test image
        run: docker compose -f docker-compose.test.yml build
        env:
          BUILDKIT_INLINE_CACHE: 1

      - name: Run tests with coverage
        run: docker compose -f docker-compose.test.yml run --rm aframp-test

      # Runs on the runner, not in the test container: the check needs git and
      # the repo history (fetch-depth: 0 above), which the Alpine image lacks.
      # It reads ./coverage, which the container wrote through its volume mount.
      - name: Require 80% coverage on changed files
        run: |
          node scripts/check-diff-coverage.js \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

  build:
    name: Build (Testnet)
    runs-on: ubuntu-latest
    needs: [code-quality, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build
        env:
          NEXT_API_URL: ${{ secrets.NEXT_API_URL }}
          NEXT_PUBLIC_STELLAR_NETWORK: TESTNET

  # ── Mainnet build ──────────────────────────────────────────────────────────
  # Runs only on pull requests that target the main branch so it does not add
  # latency to develop-branch pushes while still blocking any PR that would
  # break under production environment variables before it is merged.
  #
  # Why a second build job?
  #   The testnet and mainnet builds differ in NEXT_PUBLIC_STELLAR_NETWORK and
  #   potentially in issuer addresses and Horizon URLs embedded at build time.
  #   A build that succeeds with TESTNET config can silently fail with MAINNET
  #   config if, for example, a conditional import, a tree-shaken code-path, or
  #   an env-var assertion is only exercised with the production value.
  #   Running both builds on every PR-to-main catches those issues before they
  #   reach the release pipeline.
  build-mainnet:
    name: Build (Mainnet)
    runs-on: ubuntu-latest
    needs: [code-quality, test]
    # Only block PRs that are about to land on main — not develop pushes.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production (mainnet env)
        run: npm run build
        env:
          NEXT_API_URL: ${{ secrets.NEXT_API_URL_MAINNET }}
          NEXT_PUBLIC_STELLAR_NETWORK: MAINNET
          # Stub issuer addresses mirror what the production backend configures.
          # Use the real values via repository secrets in production; these
          # stubs only need to be syntactically valid Stellar public keys so
          # that any env-var assertions pass at build time.
          NEXT_PUBLIC_CNGN_ISSUER: ${{ secrets.MAINNET_CNGN_ISSUER }}
          NEXT_PUBLIC_USDC_ISSUER: ${{ secrets.MAINNET_USDC_ISSUER }}

  lighthouse:
    name: Lighthouse CI (90+ all categories)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build
        env:
          NEXT_API_URL: ${{ secrets.NEXT_API_URL }}
          NEXT_PUBLIC_STELLAR_NETWORK: TESTNET

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.0

      - name: Start server and run Lighthouse CI
        run: |
          npm start &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001 > /dev/null 2>&1 && echo "Server ready after ${i}s" && break
            sleep 2
          done
          lhci autorun
          kill $SERVER_PID 2>/dev/null || true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results-${{ github.run_number }}
          path: .lighthouseci/
          retention-days: 30
