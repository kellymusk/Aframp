name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier Check
        run: npm run format:check

      - name: TypeScript Check
        run: npm run type-check

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Snyk Security Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run OWASP scan
        run: bash scripts/owasp-scan.sh

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage -- --watchAll=false

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          retention-days: 1

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json', 'utf8'));
            const total = coverage.total;

            const badge = (pct) => {
              if (pct >= 80) return '🟢';
              if (pct >= 70) return '🟡';
              return '🔴';
            };

            const row = (label, metric) => `| ${label} | ${metric.pct}% | ${badge(metric.pct)} |`;

            const comment = [
              '## 📊 Coverage Report',
              '',
              '| Metric | Coverage | Status |',
              '|--------|----------|--------|',
              row('Lines', total.lines),
              row('Statements', total.statements),
              row('Functions', total.functions),
              row('Branches', total.branches),
              '',
              '🟢 = Excellent (≥80%) | 🟡 = Good (≥70%) | 🔴 = Needs Improvement (<70%)',
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  pr-description:
    name: PR Description Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require a filled-in Summary
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || ''
            const match = body.match(/## Summary\s*([\s\S]*?)(?=\n##|\n---|$)/)
            const summary = (match ? match[1] : '')
              .replace(/<!--[\s\S]*?-->/g, '')
              .replace(/^Closes #.*$/gim, '')
              .trim()
            if (summary.length < 15) {
              core.setFailed(
                "This PR's Summary section is empty or unedited from the template. " +
                'Explain what the PR does and why before requesting review.'
              )
            }

  diff-coverage:
    name: Diff Coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage -- --watchAll=false

      - name: Require 80% coverage on changed files
        run: |
          node scripts/check-diff-coverage.js \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [code-quality, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_STELLAR_NETWORK: TESTNET

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_STELLAR_NETWORK: TESTNET

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.0

      - name: Start server and run Lighthouse CI
        run: |
          npm start &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001 > /dev/null 2>&1 && echo "Server ready after ${i}s" && break
            sleep 2
          done
          lhci autorun
          kill $SERVER_PID 2>/dev/null || true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results-${{ github.run_number }}
          path: .lighthouseci/
          retention-days: 30

      - name: Comment Lighthouse report links on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let links = {};
            try {
              links = JSON.parse(fs.readFileSync('.lighthouseci/links.json', 'utf8'));
            } catch (err) {
              core.warning(`Could not read .lighthouseci/links.json: ${err.message}`);
            }

            const entries = Object.entries(links);
            const rows = entries
              .map(([url, reportUrl]) => `| ${url} | [View report](${reportUrl}) |`)
              .join('\n');

            const body = [
              '## 🔦 Lighthouse CI Report',
              '',
              entries.length
                ? `| Page | Report |\n|------|--------|\n${rows}`
                : '_No report links were produced — check the workflow run for details._',
              '',
              'Gate: fails this PR if Performance < 80, Accessibility < 90, or Best Practices < 90.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '## 🔦 Lighthouse CI Report';
            const existing = comments.find((comment) => comment.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
